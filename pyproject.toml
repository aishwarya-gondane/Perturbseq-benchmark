[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psbench"
version = "0.1.0"
description = "Benchmark of guide assignment and perturbation-effect methods on public Perturb-seq data"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "anndata",
    "scanpy",
    "pertpy",
    "torch",
    "pyyaml",
    "matplotlib",
    "tabulate",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
psbench = "psbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
